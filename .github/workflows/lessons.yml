name: بناء الدروس المنشورة بالأصوات

on:
  push:
    branches: [main]
    paths: ['lessons/**']
  workflow_dispatch:

permissions:
  contents: write
  pages: write

concurrency:
  group: build-lessons
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install edge-tts
      - run: python tools/build_lessons.py
      - name: حفظ الأصوات والدروس
        run: |
          git config user.name "lesson-builder"
          git config user.email "lesson-builder@users.noreply.github.com"
          git add audio audio-index.js lessons-extra.js sw.js index.html
          git diff --cached --quiet && exit 0
          git commit -m "بناء الدروس المنشورة: أصوات وقائمة الدروس"
          git push
      - name: إعادة نشر الموقع
        run: |
          curl -sS -X POST -H "Authorization: Bearer ${{ secrets.GITHUB_TOKEN }}" -H "Accept: application/vnd.github+json" \
            https://api.github.com/repos/${{ github.repository }}/pages/builds || true
